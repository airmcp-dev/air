name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # packages/hive는 비공개(gitignore)라 lockfile의 importer와 워크스페이스가 다름 → frozen 불가
      - run: pnpm install --no-frozen-lockfile
      # examples/*는 tsconfig 없는 예제·서버 띄우는 스크립트라 CI 범위에서 제외
      - run: pnpm turbo run build --filter='./packages/*'
      - run: pnpm turbo run lint --filter='./packages/*'
      # vitest.config.ts의 include가 루트 기준이라 패키지 디렉토리에서는 테스트를 못 찾는다 → 루트에서 한 번에
      - run: pnpm exec vitest run packages

  conformance:
    name: MCP conformance (core)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # packages/hive는 비공개(gitignore)라 lockfile의 importer와 워크스페이스가 다름 → frozen 불가
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @airmcp-dev/core build
      - name: Run conformance suite against baseline
        run: pnpm --filter @airmcp-dev/core conformance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-results
          path: packages/core/conformance-results
          if-no-files-found: ignore
